# Decap CMS configuration — Knight Warriors Club (v2)
#
# Backend is Netlify Git Gateway against the site repo (branch main).
# On Netlify you must enable: Identity (Site settings → Identity) and
# Git Gateway (Identity → Services → Git Gateway) for logins here to work.
#
# v2 data model — the site computes everything else itself in the browser:
#   data/announcements.json  manual news cards (News section + Home banner)
#   data/tournaments.json    tournaments (status drives Home / Events / History)
#   data/matches.json        fixtures & results (drive tables, records, news)
#   data/members.json        general member names

backend:
  name: git-gateway
  repo: tapranto/knight-warriors-club
  branch: main

# Where uploaded images are stored in the repo / served from.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ------------------------------------------------------------------
  - name: announcements
    label: "News"
    files:
      - name: announcements
        label: "News (News page + Home banner)"
        file: "data/announcements.json"
        fields:
          - label: "News"
            name: announcements
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: "Date / label shown on the card"
                name: date
                widget: string
                required: false
                hint: "e.g. Club News, Recruitment, or a date like 2026-10-21 (real dates sort the feed newest-first)"
              - label: "Title"
                name: title
                widget: string
              - label: "Body"
                name: body
                widget: text
              - label: "Link view (optional)"
                name: link
                widget: string
                required: false
                hint: "Section to link to, e.g. about, community, join — leave empty for no link"
              - label: "Link text (optional)"
                name: linkText
                widget: string
                required: false
              - label: "YouTube video link (optional)"
                name: youtube
                widget: string
                required: false
                hint: "Paste a YouTube link — the video plays inside the article on the website"

  # ------------------------------------------------------------------
  - name: tournaments
    label: "Tournaments"
    files:
      - name: tournaments
        label: "Tournaments"
        file: "data/tournaments.json"
        fields:
          - label: "Tournaments"
            name: tournaments
            widget: list
            summary: "{{fields.name}} ({{fields.status}})"
            fields:
              - label: "ID"
                name: id
                widget: string
                hint: "Unique, lowercase-with-dashes, e.g. efootball-tournament-legacy — matches in the Matches collection point at this ID"
              - label: "Name"
                name: name
                widget: string
              - label: "Game"
                name: game
                widget: select
                options: ["eFootball", "PUBG", "Clash of Clans", "Call of Duty"]
                default: "eFootball"
              - label: "Status"
                name: status
                widget: select
                options:
                  - { label: "Upcoming", value: "upcoming" }
                  - { label: "Running", value: "running" }
                  - { label: "Finished", value: "finished" }
                default: "upcoming"
                hint: "Running → shown on Home + Events. Upcoming → Events banner. Finished → Tournament History (+ champion news)"
              - label: "Start date"
                name: startDate
                widget: string
                required: false
                hint: "e.g. 2026-11-01"
              - label: "End date"
                name: endDate
                widget: string
                required: false
                hint: "e.g. 2026-11-20"
              - label: "Intro"
                name: intro
                widget: text
                required: false
                hint: "Format, prizes, notes — shown on the tournament's Overview"
              - label: "Participants"
                name: participants
                widget: list
                required: false
                field: { label: "Player full name", name: name, widget: string }
                hint: "Full names, matching the members list"
              - label: "Champion"
                name: champion
                widget: string
                required: false
                hint: "Full name of the winner — set when the tournament is finished"
              - label: "Champion photo"
                name: championPhoto
                widget: image
                required: false
                hint: "Shown as the backdrop of the finished tournament's Overview"
              - label: "Champion cut-out (transparent PNG)"
                name: championCutout
                widget: image
                required: false
                hint: "Transparent-background cut-out of the champion (e.g. holding a trophy) — stands at the bottom-right of the finished tournament's page header"

  # ------------------------------------------------------------------
  - name: matches
    label: "Matches"
    files:
      - name: matches
        label: "Matches (fixtures & results)"
        file: "data/matches.json"
        fields:
          - label: "Matches"
            name: matches
            widget: list
            summary: "{{fields.player1}} vs {{fields.player2}}"
            fields:
              - label: "Tournament ID"
                name: tournamentId
                widget: string
                hint: "The ID of the tournament this match belongs to, e.g. efootball-tournament-legacy"
              - label: "Date"
                name: date
                widget: string
                required: false
                hint: "e.g. 2026-11-03 (real dates sort the news feed newest-first)"
              - label: "Player 1 (full name)"
                name: player1
                widget: string
              - label: "Player 2 (full name)"
                name: player2
                widget: string
              - label: "Goals — Player 1"
                name: goals1
                widget: number
                value_type: int
                min: 0
                required: false
                hint: "Leave empty until the match is played"
              - label: "Goals — Player 2"
                name: goals2
                widget: number
                value_type: int
                min: 0
                required: false
                hint: "Leave empty until the match is played"
              - label: "Played?"
                name: played
                widget: boolean
                default: false
                hint: "Off = fixture (upcoming). On = result — the score then counts in the table, records and news"

  # ------------------------------------------------------------------
  - name: members
    label: "Members"
    files:
      - name: members
        label: "General Members"
        file: "data/members.json"
        fields:
          - label: "Member names"
            name: members
            widget: list
            field: { label: "Name", name: name, widget: string }
            hint: "One general member per entry — committee members are managed in the page itself, not here"
